<!DOCTYPE html>
<html lang="en" data-app="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Calculator</title>
<meta name="description" content="Track where your money goes: accounts, expenses with bills and slips, EMIs and budgets.">
<meta name="theme-color" content="#f5f6fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>try{var t=localStorage.getItem('xt-theme')||'light';if(t==='system')delete document.documentElement.dataset.app;else document.documentElement.dataset.app=t}catch(e){}</script>
</head>
<body>
<div class="stage">
  <div class="phone" id="ph">
    <main class="scr" id="view"></main>
    <button class="fab" data-a="add" aria-label="Add transaction"></button>
    <nav class="nav" id="nav"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"><span id="tm"></span><button id="tu">Undo</button></div>
  </div>
</div>
<input type="file" id="fi" accept="image/*,application/pdf" multiple hidden>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
